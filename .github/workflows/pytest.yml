name: pytest

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
          matrix:
            debian-version: ["12", "13"]
            sqlalchemy-version: ["1.4"]
            include:
              - debian-version: "12"
                python-version: "3.11"
                postgres-version: "15"
                postgis-version: "3.3"
              - debian-version: "13"
                python-version: "3.13"
                postgres-version: "17"
                postgis-version: "3.5"

    name: Debian ${{ matrix.debian-version }} - SQLAlchemy ${{ matrix.sqlalchemy-version }}

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Add database extensions
        run: |
          psql -h localhost -U geouser -d refgeo -tc 'CREATE EXTENSION "unaccent";'
        env:
          PGPASSWORD: geopasswd
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install GDAL
        run: |
          sudo apt update
          sudo apt install -y gdal-bin libgdal-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .[tests] 
          env:
            REF_GEO_SQLALCHEMY_DATABASE_URI: "postgresql://geouser:geopasswd@127.0.0.1:5432/refgeo"
      - name: Install database
        run: |
          flask db upgrade habitats@head
          flask db upgrade habitats_inpn_data@head
        env:
          HABREF_SETTINGS: test_settings.py
      - name: Test with pytest
        run: |
          pytest -v --cov --cov-report xml
        env:
          HABREF_SETTINGS: test_settings.py
      - name: Upload coverage to Codecov
        if: ${{ matrix.debian-version == '11' && matrix.sqlalchemy-version == '1.4' }}
        uses: codecov/codecov-action@v3
        with:
          flags: pytest
