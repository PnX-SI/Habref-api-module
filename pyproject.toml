[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypn_habref_api"
dynamic = ["version"]
description = "Python lib related to Habref referential (INPN)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU AGPLv3" }
maintainers = [
    { name = "Parcs nationaux des Écrins et des Cévennes", email = "geonature@ecrins-parcnational.fr" }
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    "alembic",
    "flask",
    "flask-sqlalchemy",
    "flask-marshmallow",
    "python-dotenv",
    "sqlalchemy<3",
    "utils-flask-sqlalchemy>=0.4.2",
    "psycopg2",
]

[project.optional-dependencies]
tests = ["pytest", "pytest-flask", "pytest-cov", "jsonschema"]

[project.urls]
Homepage = "https://github.com/PnX-SI/Habref-api-module"

[project.entry-points."alembic"]
migrations = "pypn_habref_api.migrations:versions"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pypn_habref_api*"]
exclude = ["pypn_habref_api.tests*"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.package-data]
"pypn_habref_api.migrations" = ["data/*.sql"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["src"]

[tool.black]
line-length = 99
